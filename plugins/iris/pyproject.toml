# Dependencies Hermes installs into its environment when the plugin is enabled.
# Playwright matches the version Hermes locks, so it drives the Chromium build
# already bundled in the Hermes image instead of downloading another.
[project]
name = "caduceus-iris"
version = "0.1.0"
description = "Local web_extract provider for Hermes Agent"
requires-python = ">=3.11"
dependencies = [
    "trafilatura>=2.3.1,<3",
    "pypdf>=6.21.2,<7",
    "playwright==1.62.0; sys_platform != 'android'",
]
